# Build and push the Glance image to GitHub Container Registry.
#
# Triggers:
#   - push to main          → tags: sha-<short>, main, latest
#   - push of v*.*.* tag    → tags: sha-<short>, v1.2.3, 1.2.3, 1.2, 1
#   - workflow_dispatch     → tags: sha-<short>, <branch>, optional extra tag
#
# The `sha-<short>` tag is always emitted so every image has an immutable
# handle. Auth uses the built-in GITHUB_TOKEN. Multi-arch (amd64 + arm64)
# via buildx with GHA-backed BuildKit cache.
#
# release.yaml (GoReleaser → Docker Hub + GitHub release) still runs on v*
# tags; this workflow only covers GHCR.

name: build-push

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional extra tag to apply (e.g. hotfix-2026-09-29)"
        required: false
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/glance

jobs:
  build:
    name: glance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so `git describe` finds the semver tag for stamping.
          fetch-depth: 0

      - name: Compute build metadata
        id: meta-build
        run: |
          set -euo pipefail
          sha_short="$(git rev-parse --short HEAD)"
          version="$(git describe --tags --exact-match 2>/dev/null || echo "sha-${sha_short}")"
          {
            echo "sha_short=${sha_short}"
            echo "version=${version}"
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=glance
            org.opencontainers.image.version=${{ steps.meta-build.outputs.version }}
            org.opencontainers.image.revision=${{ steps.meta-build.outputs.sha_short }}
            org.opencontainers.image.created=${{ steps.meta-build.outputs.build_time }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta-build.outputs.version }}
          cache-from: type=gha,scope=glance
          cache-to: type=gha,mode=max,scope=glance
          provenance: true
          sbom: true

      - name: Summary
        run: |
          {
            echo "### glance"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
